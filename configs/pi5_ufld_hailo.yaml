# Pi5 + Hailo-8 NPU — pi5_ufld.yaml을 상속하고 차량 검출(YOLO)과 차선 모델(UFLDv2)을 NPU로 돌린다.
# 모델 파일은 git에 없다.
# - 차선: NPU 백본(.hef) + CPU 뒷부분(ufld_tail.onnx) — 만드는 법·Pi 실측(차선 56ms)은 docs/ufld-hailo-conversion.md
# - 차량: Ultralytics format=hailo 내보내기 폴더(.hef + metadata.yaml + nms_config.json).
#   Ultralytics로 바로 열면 장치를 따로 열어 차선과 충돌한다(HAILO_OUT_OF_PHYSICAL_DEVICES) — 그래서 backend: hailo로
#   공유 장치 위에서 직접 실행한다 (src/detection/hailo_yolo.py). Ultralytics 단독 확인(2026-11-15): 추론 9.4ms
#
#   python -m src.main --config configs/pi5_ufld_hailo.yaml --source <영상>

extends: pi5_ufld.yaml

detection:
  backend: hailo
  weights: data/models/yolov8n-safewatch_hailo_model

lane:
  ufld:
    backend: hailo
    hef_path: data/models/ufld_aihub_aug.hef
    tail_path: data/models/ufld_tail.onnx

# ⚠️ 시험 브랜치(test/event-score-40) 전용 — 이벤트 생성 확인용. 판단 기준 정식 변경 아님.
# 시작 60(단서 3개)과 min_indicators 2(단서 2개)의 불일치는 risk-criteria.md 4.3 미결 — (가)/(나) 결정 전.
# 시뮬레이션 영상 진단(2026-11-15): 1번 차 사행+스웨빙 40점에서 멈춰 이벤트 0건.
risk:
  hysteresis:
    start_score: 40   # 단서 2개에서 이벤트 (원래 60 = 단서 3개)
    end_score: 20     # 단서 1개 이하로 줄면 끝 (원래 40 — 시작과 같으면 경계에서 켜졌다 꺼졌다 함)

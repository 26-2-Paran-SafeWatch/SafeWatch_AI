# Colab(GPU)에서 단서 분포를 뽑는 설정 — pc_cue_eval.yaml(1280×720, 검출 매 프레임, fps 30)과 같고 차선 모델만 GPU로.
# Colab에 onnxruntime-gpu가 깔려 있어야 한다(노트북 설치 셀). YOLO(ONNX)는 Ultralytics가 GPU를 자동으로 쓴다.
# 로그의 "UFLD ONNX 로드: … (실행 장치 [...])"에 CUDAExecutionProvider가 보이면 GPU로 도는 것이다.

extends: pc_cue_eval.yaml

lane:
  ufld:
    onnx_providers: [CUDAExecutionProvider, CPUExecutionProvider]

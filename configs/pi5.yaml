# Pi5 실기기용 — 저해상도, 검출 주기 분리, ONNX/NCNN 추론.
# default.yaml을 상속하고 아래 항목만 override한다.

extends: default.yaml

input:
  resolution: [320, 320]
  fps: 15
  source: camera

detection:
  engine: onnxruntime          # 실측 후 ncnn으로 변경 검토 (미결 사항, pipeline-architecture.md 5장)
  weights: data/models/yolov8n-safewatch.onnx
  interval: 3                  # 3프레임마다 검출, 나머지는 tracking 보간

logging:
  level: INFO

# sensors는 default.yaml의 unavailable을 그대로 쓴다 — ESP32 UART 프로토콜이
# 확정되면 src/input/sensors.py의 SerialGPSIMUSource를 구현하고 여기를
# `sensors: {source: serial, serial_port: ..., serial_baudrate: ...}`로 override한다.

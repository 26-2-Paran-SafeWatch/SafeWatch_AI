# Pi5 + Hailo-8 NPU 시험용 — pi5_ufld.yaml을 상속하고 차선 모델(UFLDv2)만 NPU(.hef)로 돌린다.
# 차량 검출(YOLO)은 아직 HEF가 없어 CPU(ONNX) 그대로다.
#
# 처음엔 scripts/check_hailo_ufld.py로 NPU 출력이 ONNX(CPU)와 같은지, 입력 방식(normalized | rgb255)이
# 어느 쪽인지 먼저 확인한다. 맞는 쪽을 아래 lane.ufld.hailo.input에 적는다.

extends: pi5_ufld.yaml

lane:
  ufld:
    backend: hailo
    hailo:
      model_path: data/models/ufld_aihub_aug.hef
      input: normalized        # [확인 필요] check_hailo_ufld.py 결과로 정할 것

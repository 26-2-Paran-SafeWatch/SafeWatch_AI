# UFLDv2 차선 모델 학습 설정 — 개발 PC(GPU 데스크탑) 전용. Pi5 실행 경로는 이 파일을 읽지 않는다.
# 모델 입출력 형상(입력 크기·격자·행 앵커)은 configs/default.yaml의 lane.ufld를 그대로 쓴다 — 학습과 실행이 어긋나지 않게.
# 실행 방법: docs/ufld-training-guide.md

data:
  fov: "60_전방"              # 이 화각만 쓴다 (우리 카메라와 가장 비슷한 화각, 노트북 평가도 이 화각)
  # 학습에서 뺄 날짜 — 2_20200916은 카메라 장착이 다른 차량. 노트북의 '틀어짐' 평가 세트라
  # 학습에 넣으면 "처음 보는 카메라" 시험이 무의미해진다.
  exclude_dates: ["20200916"]
  val_frac: 0.10              # 학습 시퀀스 중 에폭 선택용으로 떼어 둘 비율 (시퀀스 단위)
  seed: 0
  jpeg_quality: 95            # 모델 입력 크기로 잘라 저장할 때 화질

# 정답 v3 규칙 — scripts/ufld_labels.py LabelRules. 노트북 평가와 같은 뜻이어야 하므로 근거 없이 바꾸지 않는다.
labels:
  band_bottom: 0.98
  band_top: 0.56
  gap_max: 0.15
  join_tol: 0.02
  cover_min: 0.3
  double: 0.08
  width_min: 0.25
  width_max: 0.95

train:
  # 2026-11-08: 1차(20에폭, 기하 증강 없음)는 6에폭부터 과적합 → 증강을 넣고 12에폭으로 줄임
  epochs: 12
  batch_size: 32              # RTX 4070 12GB, fp16 기준. 메모리 부족이면 16
  lr: 1.0e-4                  # 사전학습 가중치에서 시작하는 파인튜닝 — 노트북 18·19번과 같은 값
  weight_decay: 1.0e-4
  warmup_steps: 500
  num_workers: 8
  amp: true                   # GPU에서만 적용
  # 손실 — 원 저장소 구성(행 위치 focal CE + 존재 CE + 평균 위치 L1). 열 출력은 실행에서 안 쓰므로 학습 안 함
  mean_loss_weight: 0.05
  augment:
    hflip: 0.5                # 좌우 뒤집기 확률 (차선 번호도 0↔3, 1↔2로 바뀜)
    brightness: 0.3           # 곱 계수 범위 1±brightness
    contrast_shift: 0.1       # 더하는 값 범위 ±(0~1 화소 기준)
    # 기하 증강 — 원 저장소 UFLDv2(cfzd) 학습 증강과 같은 크기. 사진(자르기 전 1600×533)과 차선 정답을 같이 변환한다.
    # 원본은 CULane 1640×590 기준 이동 x ±200px · y ±100px → 화면 비율로 0.12 · 0.17. 회전·확대는 화면 가운데 기준.
    # 목적: 카메라 장착 위치·각도가 달라도 차선을 찾게 (1차 재학습이 장착이 다른 카메라에서 나빠짐 — 노트북 25번)
    geometric:
      prob: 1.0               # 원본은 항상 건다
      rotate_deg: 6.0
      scale: [0.8, 1.2]
      shift_x: 0.12           # 화면 폭 대비
      shift_y: 0.17           # 화면 높이 대비 (자르기 전 높이)
  # 에폭 선택 기준: aug = 선택용 시퀀스에 기하 증강을 고정 난수로 건 손실 / plain = 증강 없는 선택용 손실(1차 방식)
  # 선택용 시퀀스도 학습과 같은 카메라 계열이라 plain만으로는 '다른 카메라에서도 버티는가'가 반영되지 않는다
  select_by: aug
  select_seed: 0
  log_every: 100              # 학습 손실 출력 간격 (스텝)
